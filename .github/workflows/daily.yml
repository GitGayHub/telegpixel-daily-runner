name: Daily Check-in Runner

on:
  schedule:
    # Запускается автоматически каждый день в 07:15 UTC (08:15 Берлин зимой / 09:15 летом)
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Действие: run (/checkin + отчёт) или stats (только проверка баланса /me)'
        type: choice
        options:
          - run
          - stats
        default: run
      dry_run:
        description: 'Тестовый режим (проверка баланса без /checkin)?'
        type: boolean
        required: false
        default: false

concurrency:
  group: telegpixel-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Persistent State Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/telegram_bot_state.json
          key: telegpixel-state-${{ github.run_id }}
          restore-keys: |
            telegpixel-state-

      - name: Run Daily Check-in & Send Coin Summary
        env:
          TELEGPIXEL_ACCOUNTS_JSON: ${{ secrets.TELEGPIXEL_ACCOUNTS_JSON }}
          TELEGPIXEL_ACCOUNTS_JSON_1: ${{ secrets.TELEGPIXEL_ACCOUNTS_JSON_1 }}
          TELEGPIXEL_ACCOUNTS_JSON_2: ${{ secrets.TELEGPIXEL_ACCOUNTS_JSON_2 }}
          TELEGPIXEL_BOT_TOKEN: ${{ secrets.TELEGPIXEL_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGPIXEL_CHAT_ID: ${{ secrets.TELEGPIXEL_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGPIXEL_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGPIXEL_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '2040' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
          TARGET_BOT_USERNAME: ${{ secrets.TARGET_BOT_USERNAME || 'sheeridverifier_bot' }}
          APP_TIMEZONE: Europe/Berlin
        run: |
          mkdir -p data
          ACTION="${{ inputs.action || 'run' }}"
          if [ "$ACTION" = "stats" ]; then
            python cli.py stats
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python cli.py run --dry-run
          else
            python cli.py run
          fi

      - name: Save Persistent State Cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/telegram_bot_state.json
          key: telegpixel-state-${{ github.run_id }}

      - name: Send Failure Alert to Telegram
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGPIXEL_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGPIXEL_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          if token and chat_id:
              text = '❌ <b>TelegPixel — Ошибка в GitHub Actions!</b>\n\nПрогон завершился с ошибкой. Проверьте логи во вкладке Actions.'
              try:
                  requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'}, timeout=10)
              except Exception:
                  pass
          "
