name: Daily Check-in Runner

on:
  schedule:
    # Запускается каждые 8 часов (00:15, 08:15, 16:15 UTC) для надёжного сбора /checkin
    - cron: '15 */8 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Действие: run (/checkin + отчёт), stats (баланс /me), backup (отправить бэкап в бот), get-code (код входа)'
        type: choice
        options:
          - run
          - stats
          - backup
          - get-code
        default: run
      target_account:
        description: 'Для get-code: имя или номер аккаунта (например Jamal или +49...)'
        required: false
        default: ''
      dry_run:
        description: 'Тестовый режим (проверка баланса без /checkin)?'
        type: boolean
        required: false
        default: false

concurrency:
  group: telegpixel-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Persistent State Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/telegram_bot_state.json
          key: telegpixel-state-${{ github.run_id }}
          restore-keys: |
            telegpixel-state-

      - name: Run Daily Check-in & Send Coin Summary
        env:
          TELEGPIXEL_ACCOUNTS_JSON: ${{ secrets.TELEGPIXEL_ACCOUNTS_JSON }}
          TELEGPIXEL_ACCOUNTS_JSON_1: ${{ secrets.TELEGPIXEL_ACCOUNTS_JSON_1 }}
          TELEGPIXEL_ACCOUNTS_JSON_2: ${{ secrets.TELEGPIXEL_ACCOUNTS_JSON_2 }}
          TELEGPIXEL_BOT_TOKEN: ${{ secrets.TELEGPIXEL_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGPIXEL_CHAT_ID: ${{ secrets.TELEGPIXEL_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGPIXEL_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGPIXEL_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '2040' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
          TARGET_BOT_USERNAME: ${{ secrets.TARGET_BOT_USERNAME || 'sheeridverifier_bot' }}
          APP_TIMEZONE: Europe/Berlin
        run: |
          mkdir -p data
          ACTION="${{ inputs.action || 'run' }}"
          NOTIFY_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            NOTIFY_FLAG="--smart-notify"
          fi
          if [ "$ACTION" = "stats" ]; then
            python cli.py stats
          elif [ "$ACTION" = "backup" ]; then
            python cli.py backup --send-telegram
          elif [ "$ACTION" = "get-code" ]; then
            python cli.py get-code "${{ inputs.target_account }}"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python cli.py run --dry-run
          else
            python cli.py run $NOTIFY_FLAG
          fi

      - name: Save Persistent State Cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/telegram_bot_state.json
          key: telegpixel-state-${{ github.run_id }}

      - name: Send Failure Alert to Telegram
        if: failure()
        continue-on-error: true
        env:
          TELEGPIXEL_BOT_TOKEN: ${{ secrets.TELEGPIXEL_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGPIXEL_CHAT_ID: ${{ secrets.TELEGPIXEL_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          from telegpixel.notifier import TelegramNotifier
          notifier = TelegramNotifier()
          notifier.send_message('❌ <b>TelegPixel — Ошибка в GitHub Actions!</b>\n\nПрогон завершился с ошибкой. Проверьте логи во вкладке Actions.')
          "
